error-log: /var/log/h2o/error.log
pid-file: /var/run/h2o/h2o.pid
user: h2o

file.dirlisting: OFF
file.index: [ 'index.html', 'index.htm', 'index.txt' ]
file.send-compressed: OFF # set ON to serve pre-compressed files (.gz / .br) if exist
compress: OFF # on-the-fly compression

http1-request-io-timeout: 10
http1-request-timeout: 60
http1-upgrade-to-http2: ON
http2-allow-cross-origin-push: OFF
http2-casper: OFF
http2-graceful-shutdown-timeout: 10
http2-idle-timeout: 10
http2-latency-optimization-min-rtt: 100
http2-max-concurrent-requests-per-connection: 100
http2-max-concurrent-streaming-requests-per-connection: 1
http2-max-streams: 100
http2-push-preload: OFF
http2-reprioritize-blocking-assets: ON
http3-graceful-shutdown-timeout: 10
http3-idle-timeout: 10
http3-max-concurrent-streaming-requests-per-connection: 1
limit-request-body: 1073741824
max-connections: 1024
max-delegations: 5
num-name-resolution-threads: 32
send-server-name: ON
# server-name: "h2o"
tcp-fastopen: 4096
tcp-reuseport: ON

hosts:
  "localhost:80":
    access-log: /var/log/h2o/access.log
    listen:
      port: 80
    paths:
      "/":
        file.dir: /var/www/html

